name: Build Applications (.exe & .apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ==========================================
  # BUILD WINDOWS (.EXE)
  # ==========================================
  build-electron:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Windows Optional Bindings
        run: |
          npm install --force
          npm install -D @tailwindcss/oxide-win32-x64-msvc --force

      - name: Build Web Assets
        env:
          VITE_IS_APP: "true"
        run: npm run build

      - name: Build Electron App
        env:
          VITE_IS_APP: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --windows nsis:x64 --publish never

      - name: Upload Windows Executable (.exe)
        uses: actions/upload-artifact@v5
        with:
          name: Windows-Executable
          path: |
            dist/*.exe
            dist/*.blockmap

  # ==========================================
  # BUILD ANDROID (.APK)
  # ==========================================
  build-apk:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --force

      - name: Build Web Assets for Capacitor
        env:
          VITE_IS_APP: "true"
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK (.apk)
        uses: actions/upload-artifact@v5
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  # ==========================================
  # RELEASE GITHUB AUTOMATIQUE
  # ==========================================
  create-release:
    name: Create GitHub Release
    needs: [build-electron, build-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Executable
        uses: actions/download-artifact@v5
        with:
          name: Windows-Executable
          path: release-assets/

      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: Android-APK
          path: release-assets/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}