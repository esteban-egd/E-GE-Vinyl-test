name: Build Applications (.exe & .apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-electron:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies with Windows Bindings
        run: npm install --os=win32 --cpu=x64

      - name: Build Web Assets
        env:
          VITE_IS_APP: "true"
        run: npm run build

      - name: Build Electron App
        env:
          VITE_IS_APP: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --windows nsis:ia32 nsis:x64

      - name: Upload Windows Executable (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Executable
          path: dist/*.exe

  build-apk:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets for Capacitor
        env:
          VITE_IS_APP: "true"
        run: npm run build

      - name: Initialize Capacitor Android if missing
        run: |
          npx cap init "E-GE Vinyl" "com.ege.vinyl" --web-dir dist || true
          npx cap add android || true

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-electron, build-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: Windows-Executable
          path: release-assets/

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: release-assets/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
