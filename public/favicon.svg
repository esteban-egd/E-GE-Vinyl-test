<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#000000"/>
  <!-- Vinyl disc -->
  <circle cx="256" cy="240" r="140" fill="#111111" stroke="url(#glow)" stroke-width="3"/>
  <circle cx="256" cy="240" r="120" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
  <circle cx="256" cy="240" r="100" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
  <circle cx="256" cy="240" r="80" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
  <circle cx="256" cy="240" r="50" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="12" fill="#000000"/>
  <!-- Neon ring -->
  <circle cx="256" cy="240" r="148" fill="none" stroke="url(#bg)" stroke-width="2" opacity="0.8"/>
  <!-- Text E GE -->
  <text x="256" y="430" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="52" font-weight="bold" letter-spacing="8">
    <tspan>E </tspan><tspan font-size="44">GE</tspan>
  </text>
  <text x="256" y="468" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="22" letter-spacing="12" opacity="0.8">VINYL</text>
</svg>